name: cobradia

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cobradia
      POSTGRES_PASSWORD: cobradia
      POSTGRES_DB: cobradia
    ports:
      - "54320:5432" # non-standard host port: a locally installed Postgres owns 5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobradia -d cobradia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  pgdata:
