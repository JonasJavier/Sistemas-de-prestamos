# Cobradía in production (decision 101): docker compose --env-file .env up -d
# Built images are tagged with APP_VERSION; see README.md in this folder.
# Its own project name: never mixed with the development stack (infra/compose.yml).
name: cobradia-production

x-backend: &backend
  image: cobradia-api:${APP_VERSION:?set APP_VERSION}
  build:
    context: ../../backend
    args:
      APP_VERSION: ${APP_VERSION}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://cobradia:${APP_DB_PASSWORD}@db:5432/cobradia
    REDIS_CACHE_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    DJANGO_ALLOWED_HOSTS: ${APP_HOST}
    FRONTEND_URL: https://${APP_HOST}
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Forward-compatible migrations run before the new version serves (doc 10 - 3).
  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - python manage.py collectstatic --noinput --verbosity 0 && exec gunicorn config.wsgi
        --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout 60
        --access-logfile - --forwarded-allow-ips '*'
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "config", "worker", "--loglevel", "INFO", "--concurrency", "2"]

  beat:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "config", "beat", "--loglevel", "INFO"]

  web:
    image: cobradia-web:${APP_VERSION}
    build:
      context: ../..
      dockerfile: infra/production/web.Dockerfile
      args:
        PUBLIC_APP_URL: https://${APP_HOST}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - static:/srv/static:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  media:
  static:
  caddydata:
  caddyconfig:
