name: CI

on:
  push:
    branches: [main]
  pull_request:

# Images come from mirror.gcr.io (Docker Hub's official images) and ghcr.io:
# Docker Hub's anonymous pull limit is shared by every job on a runner.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:8
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://cobradia:cobradia@localhost:5432/cobradia
      REDIS_CACHE_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Create non-superuser app role (RLS applies to it)
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres \
            -c "CREATE ROLE cobradia LOGIN PASSWORD 'cobradia' CREATEDB;" \
            -c "CREATE DATABASE cobradia OWNER cobradia;"
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types of the financial engine (strict)
        run: uv run mypy engine/money.py engine/rates.py engine/schedule.py engine/late_fees.py engine/allocation.py engine/payoff.py
      - name: Check missing migrations
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Production settings pass Django's deploy checks (decision 101)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: app.cobradia.com
          FRONTEND_URL: https://app.cobradia.com
          EMAIL_HOST: smtp.example.com
        run: DJANGO_SECRET_KEY="$(openssl rand -hex 40)" uv run python manage.py check --deploy --fail-level WARNING
      - name: Known vulnerabilities (doc 06 - 8)
        run: |
          uv export --frozen --no-hashes --no-dev --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Known vulnerabilities (doc 06 - 8)
        run: pnpm audit --prod
      - name: Build
        run: pnpm build

  # The production images build (decision 101); they are not pushed anywhere.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: API image
        run: docker build --build-arg REGISTRY=mirror.gcr.io/library --tag cobradia-api:ci backend
      - name: The API image starts with production settings
        run: |
          docker run --rm -e DJANGO_SECRET_KEY="$(openssl rand -hex 40)"             -e DJANGO_ALLOWED_HOSTS=app.cobradia.com -e FRONTEND_URL=https://app.cobradia.com             -e EMAIL_HOST=smtp.example.com cobradia-api:ci             python manage.py check --deploy --fail-level WARNING
      - name: Web image (Caddy, the app and the site)
        run: |
          docker build --build-arg REGISTRY=mirror.gcr.io/library \
            --file infra/production/web.Dockerfile --tag cobradia-web:ci .
      - name: The Caddyfile is valid
        run: |
          docker run --rm -e APP_HOST=app.cobradia.com -e SITE_HOST=cobradia.com             -e ACME_EMAIL=ops@cobradia.com cobradia-web:ci caddy validate --config /etc/caddy/Caddyfile

  # cobradia.com: the static promotion site (doc 01, decision 100).
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (doc 06 - 8)
        run: pnpm audit --prod
      - name: Build
        run: pnpm build

  # The phase demos as a user lives them (doc 10 - 2): the real API, the
  # production build and a browser, over the demo seed.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:8
        ports:
          - 6379:6379
      mailpit:
        image: ghcr.io/axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025 # its API: the portal spec reads the one-time code
    env:
      DATABASE_URL: postgres://cobradia:cobradia@localhost:5432/cobradia
      REDIS_CACHE_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          # The API server started by Playwright still holds uv's cache when
          # the job ends; pruning would wait on it until it times out.
          prune-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Create non-superuser app role
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres \
            -c "CREATE ROLE cobradia LOGIN PASSWORD 'cobradia' CREATEDB;" \
            -c "CREATE DATABASE cobradia OWNER cobradia;"
      - name: Backend with the demo seed
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo
          nohup uv run python manage.py runserver 127.0.0.1:8800 --noreload > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Frontend production build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm preview --port 5173 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
      - name: Wait for both servers
        run: |
          for url in http://127.0.0.1:8800/api/v1/csrf/ http://localhost:5173/entrar; do
            for i in $(seq 1 60); do curl -fsS "$url" > /dev/null && break; sleep 1; done
            curl -fsS "$url" > /dev/null
          done
      - name: Browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: pnpm e2e
      - name: Server logs and traces on failure
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
