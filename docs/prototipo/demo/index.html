<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>Demo Sistema de Préstamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Aplicación de oficina: menú lateral morado, lienzo claro, verde solo para cobrar y confirmar. Aspecto único y claro (decisión de marca). */
:root{
  color-scheme: light;
  --brand-900:#3E0647; --brand-800:#52085E; --brand-700:#6D087A; --brand-500:#9B3AA8; --brand-100:#F4E6F6; --brand-50:#FBF6FC;
  --accent:#4E8F0A; --accent-btn:#3F7A08; --accent-btn-h:#346607; --accent-100:#E8F3DA; --accent-ink:#2F5C06;
  --warn:#C2410C; --warn-ink:#9A3412; --warn-100:#FFF0E5;
  --danger:#B91C1C; --danger-ink:#991B1B; --danger-100:#FDECEC;
  --info:#0369A1; --info-100:#E4F1F9;
  --canvas:#F6F5F9; --surface:#FFFFFF; --line:#E4DFE8; --line-2:#EFEBF2;
  --text:#1C1622; --muted:#6B6475; --faint:#9A93A3;
  --f-ui:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:10px; --r-sm:7px;
  --sh:0 1px 2px rgba(62,6,71,.06),0 4px 16px rgba(62,6,71,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-700)}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab-nums{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:12.5px} .xs{font-size:11.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-84{grid-template-columns:minmax(0,8fr) minmax(0,4fr)}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g-73,.g-84,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g4,.g5{grid-template-columns:minmax(0,1fr)}}

/* ---------- Botones y campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--brand-500);background:var(--brand-50)}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.btn-p:hover{background:var(--brand-800);border-color:var(--brand-800)}
.btn-g{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff}
.btn-g:hover{background:var(--accent-btn-h);border-color:var(--accent-btn-h)}
.btn-d{color:var(--danger-ink);border-color:#F1C7C7}
.btn-d:hover{background:var(--danger-100);border-color:var(--danger)}
.btn-q{border-color:transparent;background:transparent}
.btn-sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn-lg{min-height:48px;font-size:15px;padding:0 20px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.input,.select,.area{width:100%;min-height:38px;padding:7px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.area{min-height:76px;resize:vertical}
.input:focus,.select:focus,.area:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.input.big{min-height:52px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--danger-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--brand-500)}
.chip.on{background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--brand-700)}

/* ---------- Superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flush{padding:0;gap:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card.flush .card-h{padding:14px 18px;border-bottom:1px solid var(--line)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.warn{border-left:4px solid var(--warn)} .kpi.danger{border-left:4px solid var(--danger)} .kpi.ok{border-left:4px solid var(--accent)} .kpi.k-brand{border-left:4px solid var(--brand-700)}
.alert{border-radius:var(--r-sm);padding:10px 13px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert svg{width:17px;height:17px;flex:none;margin-top:2px}
.a-w{background:var(--warn-100);color:var(--warn-ink)} .a-d{background:var(--danger-100);color:var(--danger-ink)} .a-ok{background:var(--accent-100);color:var(--accent-ink)} .a-i{background:var(--info-100);color:var(--info)} .a-b{background:var(--brand-100);color:var(--brand-900)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.b-ok{background:var(--accent-100);color:var(--accent-ink)} .b-w{background:var(--warn-100);color:var(--warn-ink)} .b-d{background:var(--danger-100);color:var(--danger-ink)} .b-i{background:var(--info-100);color:var(--info)} .b-n{background:var(--line-2);color:var(--muted)} .b-b{background:var(--brand-100);color:var(--brand-900)}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:13.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.dl .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600;color:var(--text)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 20px}
.kv div span{display:block;font-size:12px;color:var(--muted)} .kv div b{font-weight:500}
hr.sep{border:0;border-top:1px solid var(--line);margin:0;width:100%}

/* ---------- Tablas ---------- */
.tw{overflow-x:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FCFBFD;white-space:nowrap}
.t td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tbody tr:hover{background:var(--brand-50)}
.t tr.click{cursor:pointer}
.t tfoot td{font-weight:600;background:#FCFBFD;border-top:1px solid var(--line);border-bottom:0}
.t tr.hl td{background:#FFF8F1}
.t tr.paid td{color:var(--muted)}
.t a{text-decoration:none;font-weight:500}
.t a:hover{text-decoration:underline}
.scroll-y{max-height:420px;overflow:auto}
.scroll-y thead th{position:sticky;top:0;z-index:1}

/* ---------- Estructura de la app ---------- */
#app{height:100%}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{background:var(--brand-900);color:#EBDCEE;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 14px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#8BCB4A,#4E8F0A);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;flex:none}
.brand b{display:block;color:#fff;font-size:14.5px;font-weight:600;line-height:1.2}
.brand span{font-size:11.5px;color:#C9B3CE}
.nav{padding:6px 10px 16px;display:flex;flex-direction:column;gap:1px}
.nav .g{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#B596BB;padding:14px 10px 5px;font-weight:600}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#EBDCEE;text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer}
.nav a svg{width:17px;height:17px;opacity:.85;flex:none}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--brand-900)}
.nav a.on svg{opacity:1;color:var(--brand-700)}
.nav a .cnt{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;font-size:11px;padding:0 7px}
.nav a.on .cnt{background:var(--brand-100)}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#C9B3CE;display:flex;flex-direction:column;gap:8px}
.side-foot a{color:#fff;cursor:pointer;text-decoration:underline}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);min-height:62px;flex-wrap:wrap}
.searchbtn{flex:1;max-width:460px;min-width:180px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--canvas);border-radius:var(--r-sm);padding:8px 12px;color:var(--muted);cursor:pointer;font-size:13.5px}
.searchbtn svg{width:16px;height:16px}
.kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--surface)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-100);color:var(--brand-900);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.who b{display:block;font-size:13px;font-weight:600;line-height:1.2} .who span{font-size:11.5px;color:var(--muted)}
.menu-btn{display:none}
.demo-ribbon{background:var(--brand-50);border-bottom:1px solid var(--line);padding:6px 24px;font-size:12px;color:var(--brand-900);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo-ribbon a{cursor:pointer;font-weight:600}
.page{flex:1;overflow-y:auto;padding:22px 24px 48px;display:flex;flex-direction:column;gap:18px;min-height:0}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.crumbs{font-size:12.5px;color:var(--muted);margin:0 0 3px}
.crumbs a{cursor:pointer;text-decoration:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--brand-700);border-bottom-color:var(--brand-700)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .shell.nav-open .side{transform:none}
  .shell.nav-open .scrim{display:block}
  .menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  .who div{display:none}
  .page{padding:16px 16px 40px}
  .demo-ribbon{padding:6px 16px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(28,22,34,.45);z-index:39}

/* ---------- Modal, búsqueda y avisos ---------- */
.overlay{position:fixed;inset:0;background:rgba(28,22,34,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(28,22,34,.3);display:flex;flex-direction:column;max-height:88vh}
.modal.wide{max-width:860px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px}
.modal-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:6px;color:var(--muted)}
.x svg{width:20px;height:20px}
.srch-in{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.srch-in svg{width:18px;height:18px;color:var(--muted)}
.srch-in input{flex:1;border:0;outline:0;font-size:16px;background:transparent}
.srch-res{max-height:60vh;overflow-y:auto;padding:6px}
.srch-it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer}
.srch-it:hover,.srch-it.sel{background:var(--brand-50)}
.srch-g{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:10px 12px 4px;font-weight:600}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(460px,calc(100% - 32px))}
.toast{background:var(--text);color:#fff;border-radius:10px;padding:11px 15px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:tin .18s ease-out}
.toast svg{width:18px;height:18px;color:#A6E36A;flex:none}
@keyframes tin{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Pantalla de bienvenida ---------- */
.welcome{min-height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.w-left{background:var(--brand-900);color:#EBDCEE;padding:48px 44px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.w-left::after{content:"";position:absolute;right:-120px;bottom:-120px;width:360px;height:360px;border-radius:50%;border:56px solid rgba(139,203,74,.14)}
.w-left h1{color:#fff;font-size:34px;font-weight:600;line-height:1.15;max-width:15ch}
.w-left p{margin:0;max-width:44ch;font-size:14.5px;color:#D9C6DD}
.w-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;position:relative;z-index:1}
.w-list li{display:flex;gap:10px}
.w-list svg{width:18px;height:18px;color:#8BCB4A;flex:none;margin-top:1px}
.w-right{padding:48px 44px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;text-align:left;transition:border-color .12s,box-shadow .12s}
.role:hover{border-color:var(--brand-500);box-shadow:var(--sh)}
.role .ic{width:42px;height:42px;border-radius:10px;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;flex:none}
.role .ic svg{width:21px;height:21px}
.role b{display:block;font-size:14.5px;font-weight:600}
.role span{display:block;font-size:12.5px;color:var(--muted)}
.role.feat{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.role.feat .ic{background:var(--accent-100);color:var(--accent-ink)}
@media (max-width:900px){.welcome{grid-template-columns:minmax(0,1fr)}.w-left,.w-right{padding:32px 18px}.w-left h1{font-size:27px}.roles{grid-template-columns:minmax(0,1fr)}}

/* ---------- Teléfono (cobrador y portal) ---------- */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px 16px;background:radial-gradient(1200px 600px at 70% 10%,#EFE3F1,transparent),var(--canvas)}
.stage-note{max-width:330px;display:flex;flex-direction:column;gap:14px}
.stage-note h2{font-size:22px}
.device{width:390px;height:800px;max-height:calc(100vh - 56px);border-radius:44px;background:#17111B;padding:12px;box-shadow:0 30px 80px rgba(62,6,71,.28);flex:none}
.screen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column;position:relative}
.m-top{background:var(--brand-900);color:#fff;padding:26px 18px 16px;display:flex;flex-direction:column;gap:10px}
.m-top a{color:#E3CFE7;cursor:pointer;font-size:13px;text-decoration:none}
.m-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m-nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.m-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 12px;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:none}
.m-nav a svg{width:20px;height:20px}
.m-nav a.on{color:var(--brand-700);font-weight:600}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}
.stop.cur{border:2px solid var(--brand-700)}
.stop.done{opacity:.72}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar>div{height:100%;background:var(--accent)}
@media (max-width:760px){.stage + .tour-fab,.stage + .tour{display:none}.stage{padding:0;display:block}.stage-note{display:none}.device{width:100%;height:100%;max-height:none;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}}

/* ---------- Documentos ---------- */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 38px;font-size:13px;line-height:1.7;position:relative;overflow:hidden;color:#231B27}
.paper h3{text-align:center;font-size:15px;letter-spacing:.06em;margin-bottom:14px}
.paper p{margin:0 0 10px}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wm span{transform:rotate(-24deg);font-size:26px;font-weight:700;color:rgba(185,28,28,.12);text-align:center;line-height:1.2;text-transform:uppercase}
.thermal{width:302px;margin:0 auto;background:#fff;border:1px dashed #CFC8D4;padding:16px 14px;font-family:var(--f-mono);font-size:12px;line-height:1.55;color:#111}
.thermal .c{text-align:center}
.thermal .l{display:flex;justify-content:space-between;gap:8px}
.thermal hr{border:0;border-top:1px dashed #999;margin:6px 0}
.wa{background:#E7DDD3;border-radius:12px;padding:14px;display:flex;flex-direction:column}
.wa .bub{align-self:flex-end;background:#D9FDD3;border-radius:10px 2px 10px 10px;padding:9px 11px;font-size:13px;max-width:92%;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.08);color:#111}
.wa .bub small{display:block;text-align:right;color:#667;font-size:10.5px}
.map{position:relative;border-radius:var(--r);overflow:hidden;background:#EEF1EA;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- Recorrido ---------- */
.tour{position:fixed;right:18px;bottom:18px;z-index:50;width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(62,6,71,.22);display:flex;flex-direction:column;max-height:calc(100vh - 36px)}
.tour-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour-b{overflow-y:auto;padding:6px}
.tstep{display:flex;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;align-items:flex-start}
.tstep:hover{background:var(--brand-50)}
.tstep .n{width:24px;height:24px;border-radius:50%;background:var(--brand-100);color:var(--brand-900);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.tstep.done .n{background:var(--accent);color:#fff}
.tstep b{display:block;font-size:13px;font-weight:600}
.tstep span{display:block;font-size:12px;color:var(--muted)}
.tour-fab{position:fixed;right:18px;bottom:18px;z-index:50}
.tour-fab .btn{box-shadow:0 10px 30px rgba(62,6,71,.3);min-height:44px;border-radius:999px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:92px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px}
.bars .b:hover{background:var(--brand-50)}
.bars .track{height:12px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bars .track div{height:100%;border-radius:99px}
.gauge{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--accent) 0 35%,#E3A008 35% 50%,var(--danger) 50% 100%);position:relative}
.gauge i{position:absolute;top:-5px;width:3px;height:20px;background:var(--text);border-radius:2px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--line-2);color:var(--muted);font-weight:500}
.steps span.on{background:var(--brand-700);color:#fff}
.steps span.ok{background:var(--accent-100);color:var(--accent-ink)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

function portfolio() {
  const act = S.loans.filter(l => l.status !== 'saldado');
  const ss = act.map(l => [l, st(l)]);
  const cartera = sum(ss, ([, s]) => s.capPend);
  const par30 = sum(ss.filter(([, s]) => s.dias > 30), ([, s]) => s.capPend);
  const tr = [0, 0, 0, 0, 0, 0].map(() => ({ n: 0, amt: 0 }));
  ss.forEach(([, s]) => { if (s.tramo) { tr[s.tramo].n++; tr[s.tramo].amt += s.vencido + s.mora; } });
  const hoyRc = S.receipts.filter(r => r.t === TODAY && !r.rev);
  return { act, ss, cartera, par30, tr, hoyRc, cobradoHoy: sum(hoyRc, r => r.total), venceHoy: sum(ss, ([, s]) => s.hoyAmt), vencido: sum(ss, ([, s]) => s.vencido + s.mora), nAtraso: ss.filter(([, s]) => s.dias > 0).length };
}
function chart14() {
  const days = []; for (let k = 13; k >= 0; k--) { const t = TODAY - k * DAY; days.push({ t, v: sum(S.receipts.filter(r => r.t === t && !r.rev), r => r.total) }); }
  const max = Math.max(...days.map(d => d.v), 1); const nice = Math.ceil(max / 10000) * 10000 || 10000;
  const W = 640, H = 200, L = 52, B = 26, T = 10, bw = (W - L - 8) / days.length;
  let g = '';
  for (let k = 0; k <= 4; k++) { const y = T + (H - T - B) * (1 - k / 4); g += `<line x1="${L}" x2="${W - 4}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${(nice * k / 4 / 1000).toLocaleString('en-US')}k</text>`; }
  days.forEach((d, k) => {
    const h = (H - T - B) * d.v / nice, x = L + k * bw + 4, y = H - B - h, isT = d.t === TODAY, off = isOff(d.t);
    g += `<rect x="${x}" y="${y}" width="${bw - 8}" height="${Math.max(h, d.v ? 2 : 0)}" rx="3" fill="${isT ? 'var(--accent)' : 'var(--brand-700)'}" opacity="${isT ? 1 : .82}"><title>${fd(d.t)}: ${money(d.v)}</title></rect>`;
    g += `<text x="${x + (bw - 8) / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="${isT ? 'var(--text)' : 'var(--muted)'}" font-weight="${isT ? 600 : 400}">${off && !d.v ? '·' : new Date(d.t).getUTCDate()}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cobros por día de los últimos 14 días" style="width:100%;height:auto">${g}</svg>`;
}

    <section class="card flush"><div class="card-h"><h2>Pendientes de hoy</h2></div><div class="tw"><table class="t"><thead><tr><th>Préstamo</th><th>Cliente</th><th>Estado</th><th class="num">Exigible</th><th></th></tr></thead><tbody>${list.map(l => `<tr><td>${l.id}</td><td>${CL[l.cid].nombre}</td><td>${st(l).dias ? statusBadge(null, l) : '<span class="badge b-i">Vence hoy</span>'}</td><td class="num">${money(st(l).exig)}</td><td class="num"><button class="btn btn-sm btn-g" data-go="cobrar" data-p='{"id":"${l.id}"}'>Cobrar</button></td></tr>`).join('')}</tbody></table></div></section>`;

  if (!S.pay || S.pay.id !== L.id) S.pay = { id: L.id, mode: s.exig > 0 ? 'vencido' : 'proxima', medio: 'Efectivo', rec: '' };
  return `${hdr(crumb('cobrar', 'Cobrar') + ' › ' + L.id, 'Cobrar a ' + c.nombre, `${L.id} · ${PROD[L.prod]} · cuota ${money(cuotaOf(L))} ${FREQ[L.freq].l.toLowerCase()}`, `<button class="btn" data-go="prestamo" data-p='{"id":"${L.id}"}'>Ver expediente</button>`)}

  ${S.gest.find(g => g.loanId === L.id && g.prom && g.prom.t === TODAY && !g.prom.kept) ? `<div class="alert a-i">${ic('info')}<span>Prometió pagar hoy ${mk(S.gest.find(g => g.loanId === L.id && g.prom && g.prom.t === TODAY).prom.amt)}. Al cobrar, la promesa se marca como cumplida.</span></div>` : ''}
  <div class="grid g-73" style="align-items:start">

          <div class="field"><label>Medio de pago</label><div class="chips" id="pmedio">${['Efectivo', 'Transferencia', 'Cheque', 'Depósito'].map(m => `<button class="chip ${S.pay.medio === m ? 'on' : ''}" data-act="pmedio" data-v="${m}">${m}</button>`).join('')}</div></div>
        </div>
        <div id="cashBox">${cashBox(L, s, payDefault(L, s))}</div>
      </section>
      <section class="card"><h2>Así se aplicará</h2><div id="payPrev">${payPreview(L, payDefault(L, s))}</div></section>

      <hr class="sep"><h3>Cuotas pendientes</h3>
      <div class="stack" style="gap:6px">${L.rows.filter(r => r.pend > 0.004).slice(0, 5).map(r => `<div class="row between small"><span>Cuota ${r.n} · ${fd(r.date)} ${r.date < TODAY ? `<span class="badge b-w">${Math.round((TODAY - r.date) / DAY)} d</span>` : r.date === TODAY ? '<span class="badge b-i">hoy</span>' : ''}</span><span class="tab-nums">${money(r.pend, false)}${r.mora ? ' + ' + money(r.mora, false) + ' mora' : ''}</span></div>`).join('')}</div>
      <button class="btn btn-g btn-lg" id="payBtn" data-act="pay">${ic('check')} Confirmar cobro</button>
      <p class="xs muted" style="margin:0">Al confirmar se genera el recibo, se registra en la caja y queda en el historial. Si se equivoca, se corrige con un reverso autorizado.</p>
    </section>
  </div>`;
};
function payDefault(L, s) { const m = S.pay.mode; if (m === 'vencido') return s.exig; if (m === 'saldar') return s.payoff; if (m === 'proxima') { const r = L.rows.find(r => r.pend > 0.004); return r ? r2(r.pend + (r.mora || 0)) : 0; } return num(S.pay.amt || 0); }
function cashBox(L, s, amt) {
  if (S.pay.medio !== 'Efectivo') return `<div class="field"><label for="pref">Referencia de la ${S.pay.medio.toLowerCase()}</label><input class="input" id="pref" placeholder="Número de confirmación o de cheque"></div>`;
  const rec = num(S.pay.rec || 0); const cambio = r2(rec - amt);
  const bills = [...new Set([Math.ceil(amt), Math.ceil(amt / 100) * 100, Math.ceil(amt / 500) * 500, Math.ceil(amt / 1000) * 1000])].filter(v => v >= amt).slice(0, 4);
  return `<div class="grid g2"><div class="field"><label for="prec">Efectivo recibido (RD$)</label><input class="input big" id="prec" data-live="rec" inputmode="decimal" value="${esc(S.pay.rec)}" placeholder="0.00"><div class="chips">${bills.map(b => `<button class="chip" data-act="bill" data-v="${b}">${b === Math.ceil(amt) ? 'Exacto' : mk(b)}</button>`).join('')}</div></div>
    <div id="chg" class="alert ${rec && cambio < 0 ? 'a-d' : 'a-ok'}" style="flex-direction:column;gap:2px;justify-content:center"><span class="small">Cambio a devolver</span><b style="font-size:24px" class="tab-nums">${rec ? (cambio < 0 ? 'Faltan ' + money(-cambio) : money(cambio)) : '—'}</b></div></div>`;
}
function currentPayAmt(L, s) { const el = document.getElementById('pamt'); return el ? num(el.value) : payDefault(L, s); }
function payPreview(L, amt) {
  if (amt <= 0) return '<p class="muted small" style="margin:0">Escriba un monto.</p>';
  const Lc = structuredClone(L); const res = S.pay.mode === 'saldar' ? settle(Lc) : allocate(Lc, amt); const s2 = st(Lc);
  const applied = r2(res.mora + res.int + res.cap);
  return `<dl class="dl"><dt>Mora</dt><dd>${money(res.mora)}</dd><dt>Interés</dt><dd>${money(res.int)}</dd><dt>Capital</dt><dd>${money(res.cap)}</dd><dt class="tot">Total aplicado</dt><dd class="tot">${money(applied)}</dd></dl>
  <div class="small muted">${res.alloc.map(a => `Cuota ${a.n}: ${money(r2(a.mora + a.int + a.cap), false)}`).join(' · ')}</div>
  ${res.rest > 0.004 ? `<div class="alert a-w">${ic('alert')}<span>Sobran ${money(res.rest)}: el préstamo queda saldado y ese monto no se aplica.</span></div>` : ''}
  <div class="alert ${s2.status === 'saldado' ? 'a-ok' : s2.dias ? 'a-w' : 'a-ok'}">${ic(s2.status === 'saldado' ? 'check' : 'info')}<span>Después del cobro: ${s2.status === 'saldado' ? '<b>préstamo saldado</b>' + (res.saldo ? '; se descuentan los intereses futuros' : '') + '.' : `saldo de capital <b>${money(s2.capPend)}</b>, ${s2.dias ? `queda con ${s2.dias} días de atraso` : '<b>queda al día</b>'}${s2.next ? `; próxima cuota el ${fd(s2.next.date)}` : ''}.`}</span></div>`;
}
function doPay(L, amt, medio, rec, canal, user) {
  const before = structuredClone(L.rows); const bStatus = L.status;
  const res = S.pay && S.pay.mode === 'saldar' ? settle(L) : allocate(L, amt);
  const total = r2(res.mora + res.int + res.cap);
  const r = { no: 'SD-R-' + pad6(S.rcpt++), t: TODAY, time: now(), loanId: L.id, cid: L.cid, mora: res.mora, int: res.int, cap: res.cap, total, medio, recibido: rec, cambio: rec ? r2(rec - total) : 0, canal, user, alloc: res.alloc, rev: false, before, bStatus };
  S.receipts.push(r);
  if (canal === 'oficina' && S.caja.estado === 'abierta') S.caja.movs.push({ time: r.time, tipo: 'Cobro', ref: r.no, desc: CL[L.cid].nombre + ' · ' + L.id, in: total, out: 0, medio });
  S.gest.filter(g => g.loanId === L.id && g.prom && g.prom.t === TODAY).forEach(g => g.prom.kept = true);
  L.hist.push({ t: TODAY, txt: (res.saldo ? 'Préstamo saldado · ' : '') + 'Cobro ' + r.no + ' por ' + money(total) });
  log(canal === 'ruta' ? 'Cobró en ruta' : 'Cobró', L.id + ' · ' + r.no + ' · ' + money(total));
  return r;
}

  pol() { document.getElementById('polOut').innerHTML = polOut(num(document.getElementById('pv-a').value), Math.round(num(document.getElementById('pv-d').value))); },
  renew(el) { document.getElementById('rnOut').innerHTML = renewOut(LN(el.dataset.id), num(el.value)); },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-go],[data-act]'); if (!el) return;
  if (el.dataset.act) { const f = ACT[el.dataset.act]; if (f) { if (el.tagName === 'A' || el.tagName === 'BUTTON') ev.preventDefault(); f(el, ev); } return; }
  ev.preventDefault(); const p = el.dataset.p ? JSON.parse(el.dataset.p) : {}; if (el.dataset.go === 'cobrar' || el.dataset.go === 'rcobrar') S.pay = null; go(el.dataset.go, p);
});
document.addEventListener('input', ev => { const k = ev.target.dataset?.live; if (k && LIVE[k]) LIVE[k](ev.target); });
document.addEventListener('change', ev => { if (ev.target.dataset?.change === 'role') setRole(ev.target.value); else { const k = ev.target.dataset?.live; if (k && ev.target.tagName === 'SELECT' && LIVE[k]) LIVE[k](ev.target); } });
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.dataset.submit === 'newClient') {
    const doc = clean(document.getElementById('nc-doc').value); if (C.find(c => c.doc.replace(/\D/g, '') === doc.replace(/\D/g, ''))) return toast('Ese cliente ya existe. Abra su ficha.');
    const id = 'C' + (C.length + 1); const c = { id, nombre: clean(document.getElementById('nc-name').value), tipo: 'persona', doc, tel: clean(document.getElementById('nc-tel').value), dir: clean(document.getElementById('nc-dir').value) || document.getElementById('nc-city').value, trabajo: clean(document.getElementById('nc-job').value) || '—', clas: 'B', suc: 'Santo Domingo Este', alta: TODAY, ingreso: num(document.getElementById('nc-inc').value) };
    C.push(c); CL[id] = c; log('Registró un cliente', c.nombre); go('cliente', { id }); toast('Cliente registrado. Ya puede crearle una solicitud.');
  }
});
document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k' && S.role && S.role !== 'cobrador' && S.role !== 'cliente') { ev.preventDefault(); ACT.search(); }
  if (ev.key === 'Escape' && S.modal) ACT.close();
  if (ev.key === 'Enter' && S.modal?.search) { const f = document.querySelector('#srchRes .srch-it'); if (f) f.click(); }
});
seed();
render();
</script>
